plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'ca.fuwafuwa.kaku'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // applicationId, versionCode and versionName come from shiroikuma/fork.gradle.
    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    packaging {
        // Compress the native libraries (ONNX Runtime's is 28 MB raw): a smaller APK to carry and
        // back up, for a one-time extraction at install.
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md']
        }
    }


    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Tesseract 5 (Tesseract4Android, Apache-2.0) — successor of the dead tess-two 9.0.0 (JCenter).
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp:4.9.0'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.j256.ormlite:ormlite-android:5.1'
    implementation 'com.atilika.kuromoji:kuromoji-core:0.9.0'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    // MangaOCR on the device (MIT) — the int8 ONNX export of kha-white/manga-ocr-base, imported by hand.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    // 白い熊 画 カメラ — the camera view (AndroidX CameraX, open source; no Play Services).
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    testImplementation 'junit:junit:4.13.2'
    // Probably just delete all these was trying to get GenerateDictionary to work as a Unit Test
    testImplementation 'com.j256.ormlite:ormlite-core:5.1'
    testImplementation 'com.j256.ormlite:ormlite-jdbc:5.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.25.2'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'kxml2:kxml2:2.3.0'
}
apply from: "$rootDir/shiroikuma/fork.gradle"   // shiroikuma-kaku fork layer — keep last
