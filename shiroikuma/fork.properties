# shiroikuma-kaku version + build counter — read by shiroikuma/fork.gradle, BUILD_NUMBER bumped by `buildFork`.
# Own versioning (upstream Kaku is dead since 2022): VERSION_NAME is a semver triplet that moves only
# with 白い熊's OK. BUILD_NUMBER is the "+NNN" counter the NEXT build takes — zero-padded to three
# digits in the name (0.0.0+001), bumped by every build, NEVER reset, so no two APKs share a name.
# versionCode = major*100000000 + minor*1000000 + patch*10000 + BUILD_NUMBER;
# LAST_BUILT_VERSION_CODE is the floor buildFork refuses to go at or below.
VERSION_NAME=0.1.0
BUILD_NUMBER=19
LAST_BUILT_VERSION_CODE=1000018
